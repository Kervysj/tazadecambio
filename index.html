<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de tasa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f4;--sf:#fff;--ink:#10222b;--mut:#5b6d76;--ln:#d5dee3;--ac:#f2b134;--ok:#1f8a70;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b161c;--sf:#13232b;--ink:#e8f0f3;--mut:#8fa3ad;--ln:#264049;--ok:#4cc7a4;--bad:#ff8a7d}}
:root[data-theme="dark"]{--bg:#0b161c;--sf:#13232b;--ink:#e8f0f3;--mut:#8fa3ad;--ln:#264049;--ok:#4cc7a4;--bad:#ff8a7d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}label:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;padding:12px;font:600 18px inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{padding:11px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:9px;font:600 14px inherit;cursor:pointer}
.btn.on{background:var(--ac);color:#10222b;border-color:var(--ac)}
.steps div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.steps div:last-child{border:0}.steps span{color:var(--mut);font-size:14px}.steps b{text-align:right}
.big{font-size:38px;font-weight:800;line-height:1.1;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.cta{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#10222b;font:800 17px inherit;cursor:pointer;margin-top:10px}
</style></head><body><div class="w">
<h1>Calculadora de tasa del día</h1>
<div class="card">
 <h2>Tus datos</h2>
 <label>Precio de venta del USDT en Bs (destino)</label><input id="sell" type="number" step="any" value="65">
 <label>Precio de compra del USDT en la moneda de origen (ej. BRL)</label><input id="buy" type="number" step="any" value="5.8">
 <label>Margen de ganancia (%) — se resta al equilibrio</label><input id="m" type="number" step="any" value="2">
 <label>Ajuste (%) — se aplica sobre el resultado anterior</label>
 <div class="row"><input id="a" type="number" step="any" value="6"><button class="btn" data-p="4">4%</button><button class="btn" data-p="6">6%</button><button class="btn" data-p="12">12%</button></div>
 <label>El ajuste se…</label>
 <select id="sg"><option value="1">Suma (+)</option><option value="-1">Resta (−)</option></select>
</div>
<div class="card steps">
 <h2>Paso a paso</h2>
 <div><span>1. Punto de equilibrio = venta ÷ compra</span><b id="s1"></b></div>
 <div><span>2. Menos margen de ganancia</span><b id="s2"></b></div>
 <div><span>3. Más / menos ajuste</span><b id="s3"></b></div>
</div>
<div class="card">
 <div class="mut">Tasa a establecer</div><div class="big" id="rate"></div>
 <div id="verdict" class="mut"></div>
 <label>Prueba: cliente envía (monto en origen)</label><input id="t" type="number" step="any" value="200">
 <div class="steps" style="margin-top:6px">
  <div><span>Cliente recibe</span><b id="r1"></b></div>
  <div><span>Valor a punto de equilibrio</span><b id="r2"></b></div>
  <div><span>Tu ganancia en esa operación</span><b id="r3"></b></div>
  <div><span>Ganancia por cada 100 unidades</span><b id="r4"></b></div>
 </div>
 <button class="cta" id="cp">Copiar tasa</button>
</div>
<script>
const $=i=>document.getElementById(i);
const f=(n,d=2)=>isFinite(n)?n.toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
function go(){
 const sell=+$('sell').value,buy=+$('buy').value,m=+$('m').value,a=+$('a').value,sg=+$('sg').value,t=+$('t').value;
 const eq=sell/buy,p2=eq*(1-m/100),rate=p2*(1+sg*a/100),gain=t*(eq-rate),g100=100*(eq-rate);
 $('s1').textContent=f(eq,4)+' Bs';
 $('s2').textContent=f(eq,4)+' − '+f(m)+'% = '+f(p2,4);
 $('s3').textContent=f(p2,4)+(sg>0?' + ':' − ')+f(a)+'% = '+f(rate,4);
 $('rate').textContent=f(rate,2)+' Bs';
 $('r1').textContent=f(t*rate)+' Bs';
 $('r2').textContent=f(t*eq)+' Bs';
 $('r3').textContent=f(gain)+' Bs · '+f(gain/sell)+' USDT';
 $('r4').textContent=f(g100)+' Bs';
 const v=$('verdict'),neg=rate>eq;
 v.className=neg?'bad':'ok';
 v.textContent=neg?'Atención: la tasa supera tu punto de equilibrio, con ella pierdes dinero.':'Tasa por debajo del equilibrio: operación con ganancia.';
 ['r3','r4'].forEach(i=>$(i).className=neg?'bad':'ok');
 window._rate=rate;
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',go));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('a').value=b.dataset.p;go()});
$('cp').onclick=()=>{const s=f(window._rate,2);try{navigator.clipboard.writeText(s)}catch(e){}$('cp').textContent='Copiada: '+s;setTimeout(()=>$('cp').textContent='Copiar tasa',1500)};
go();
</script></div></body></html>
